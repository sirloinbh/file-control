name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (node ${{ matrix.node }})
    # The zip tests use the default Windows tar.exe (bsdtar), so they run on a Windows runner.
    # The runner image and action SHAs are pinned to versions.json in sirloinbh/project-standards (#439).
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      # Fails when a centrally managed file (skills, hooks, settings, templates) differs from sirloinbh/project-standards.
      - name: Standards check
        run: node .standards/check.mjs
